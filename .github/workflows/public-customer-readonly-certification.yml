name: Public Customer Website Read-Only Browser Certification

on:
  push:
    branches:
      - feat/turso-checkout-recovery-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-safe-mobile-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install browser dependencies
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Read-only public customer journey on mobile and desktop
        run: npx playwright test --config=playwright.public-readonly.config.ts
      - name: Store browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-customer-browser-regression-traces
          path: |
            test-results/
            playwright-public-report/
          retention-days: 7
