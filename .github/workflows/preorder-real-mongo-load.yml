name: Preorder Real Mongo Load Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/preorder/**'
      - 'app/api/preorder/**'
      - 'tests/preorder-real-mongo-load.test.ts'
      - 'tests/checkout-atomic-mongo-load.test.ts'
      - 'lib/idempotency.ts'
      - 'app/api/orders/create/route.js'
      - '.github/workflows/preorder-real-mongo-load.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mongo-replica-load:
    name: 1000 checkout requests against real Mongo ACID transactions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREORDER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Start isolated replica set
        run: |
          set -euo pipefail
          docker run --rm -d --name cert-mongo -p 127.0.0.1:27017:27017 mongo:7.0             mongod --replSet rs0 --bind_ip_all --quiet
          ready=0
          for i in $(seq 1 45); do
            if docker exec cert-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec cert-mongo mongosh --quiet --eval             'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 45); do
            if docker exec cert-mongo mongosh --quiet --eval               'rs.status().myState' 2>/dev/null | grep -qx 1; then exit 0; fi
            sleep 2
          done
          echo "Replica set did not elect a primary" >&2
          exit 1
      - name: Verify 1000 real Mongo checkout transactions
        run: npx vitest run tests/preorder-real-mongo-load.test.ts tests/checkout-atomic-mongo-load.test.ts --reporter=verbose
      - name: Stop isolated database
        if: always()
        run: docker rm -f cert-mongo || true
