name: Lemonade Packs Real Square Sandbox
on:
  push:
    branches:
      - feat/lemonade-packs-20261024
    paths:
      - scripts/certify-lemonade-packs-square-sandbox.mjs
      - .github/workflows/lemonade-packs-square-sandbox.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sandbox-packs:
    name: Real Square sandbox 4/6-pack order, capture and refund
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: square-sandbox-certification
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Certify two real sandbox pack payments and refunds
        env:
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: node scripts/certify-lemonade-packs-square-sandbox.mjs
      - name: Attach sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lemonade-packs-square-sandbox-${{ github.run_id }}
          path: test-results/lemonade-square-sandbox-certification.json
          if-no-files-found: error
          retention-days: 30
