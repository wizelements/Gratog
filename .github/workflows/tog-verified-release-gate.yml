name: Taste of Gratitude Verified Release Gate

# This is a CI gate, NOT authorization to publish or change merchant data.
# Every release still needs independent review, preview and post-deploy evidence.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Independent Linux Release Checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      VERCEL_ENV: preview
      SQUARE_ENVIRONMENT: sandbox
      SQUARE_ACCESS_TOKEN: ci-square-token-placeholder
      SQUARE_APPLICATION_ID: ci-square-app-placeholder
      SQUARE_LOCATION_ID: ci-square-location-placeholder
      SQUARE_WEBHOOK_SIGNATURE_KEY: ci-square-webhook-placeholder
      RESEND_WEBHOOK_SECRET: ci-resend-webhook-placeholder
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      ADMIN_SETUP_SECRET: ci-admin-setup-secret

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --include=dev

      - name: Verify this release gate cannot mask failures
        run: node --test tests/release/release-automation-fail-closed.test.mjs

      - name: Verify deploy safety
        run: scripts/gratog-deploy-guard.sh --target production --dry-run

      - name: TypeScript must pass
        run: npm run typecheck:ci

      - name: Targeted closure lint must pass
        run: |
          ESLINT_USE_FLAT_CONFIG=false npx eslint \
            app/rewards/page.tsx \
            app/gratitude/rewards/page.jsx \
            app/reviews/page.jsx \
            'app/(site)/community/page.tsx' \
            app/subscriptions/page.js \
            app/robots.ts \
            app/sitemap.ts \
            lib/pwa.ts \
            tests/route-governance.test.ts \
            tests/pwa-cache-governance.test.ts

      - name: Vitest suite must pass
        run: npx vitest run --reporter=dot

      - name: Linux production build must pass
        run: npm run build

      - name: Write exact-head CI evidence
        # This step is unreachable if any required command fails.
        env:
          COMMIT_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const evidence = {
            schema: 'tog-ci-evidence-v1',
            status: 'CI_VERIFIED_NOT_PRODUCTION',
            sha: process.env.COMMIT_SHA,
            runId: process.env.CI_RUN_ID,
            ref: process.env.REF_NAME,
            checks: [
              'gate-negative-controls',
              'deploy-guard-dry-run',
              'typescript',
              'targeted-closure-eslint',
              'full-vitest',
              'linux-production-build'
            ],
            independentReview: 'PENDING',
            previewCustomerJourney: 'PENDING',
            merchantSellabilityReadback: 'PENDING',
            productionSmokeReadback: 'PENDING',
            productionCertified: false
          };
          writeFileSync('DEPLOYMENT_MANIFEST.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
          echo 'CI checks passed on the exact commit. This is NOT production certification; independent preview, merchant-state and deployment verification remain separate release gates.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ci-evidence
          path: DEPLOYMENT_MANIFEST.json
          retention-days: 90
          if-no-files-found: error

  release-notes:
    name: Release Notes After Verified CI
    needs: [verify]
    if: ${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'chore: release') || startsWith(github.event.head_commit.message, 'release:')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Summarize release candidate without publishing
        run: |
          echo '## Release candidate checked by independent Linux CI' >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty=format:'%h - %s' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI success is not a claim of customer-facing production certification.' >> "$GITHUB_STEP_SUMMARY"
