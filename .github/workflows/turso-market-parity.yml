name: Turso market data parity (non-release)
on:
  pull_request:
    branches:
      - feat/turso-checkout-recovery-20261017
    paths:
      - 'scripts/migrate/transformers.mjs'
      - 'lib/markets/repository.ts'
      - 'lib/markets/schema.ts'
      - 'lib/markets/turso-markets.mjs'
      - 'tests/migration/turso-market-parity.test.mjs'
      - 'tests/migration/turso-market-crud.test.mjs'
      - 'app/api/admin/markets/route.ts'
      - '.github/workflows/turso-market-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static syntax and preservation verification
        run: |
          node --check scripts/migrate/transformers.mjs
          node --check lib/markets/turso-markets.mjs
          node --test \
            tests/migration/turso-market-parity.test.mjs \
            tests/migration/turso-market-crud.test.mjs \
            tests/migration/turso-migration-hygiene.test.mjs \
            tests/migration/legacy-commerce-references.test.mjs \
            tests/migration/turso-preview-pricing.test.mjs \
            tests/release/turso-cutover-gates.test.mjs
      - name: Explicitly retain independent cutover hold
        run: |
          test -f scripts/release/check-turso-cutover.mjs || {
            echo "::error::Cutover authority script was removed"
            exit 1
          }
          echo "This workflow does not authorize production cutover."
