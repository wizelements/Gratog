name: Real Square Sandbox Certification

# Automated PR checks NEVER receive financial credentials.
# A reviewed operator runs the sandbox transaction workflow manually using a
# protected GitHub Environment (with required reviewers and branch rules).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/certify-square-sandbox.mjs'
      - '.github/workflows/real-square-sandbox-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-evidence-required:
    if: github.event_name == 'pull_request'
    name: Square sandbox provider proof not yet certified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block promotion until protected sandbox certification evidence exists
        run: |
          echo "::error title=SANDBOX_PROOF_REQUIRED::Real Square sandbox capture/refund and application reconciliation are release blockers. Run an approved workflow_dispatch with a protected square-sandbox-certification environment; never expose Square secrets to pull_request code."
          exit 1

  square-sandbox-transaction:
    if: github.event_name == 'workflow_dispatch'
    name: Actual sandbox order, payment, declined card, replay and refund
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: square-sandbox-certification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Assert and certify only Square Sandbox
        env:
          # Existing integration secret is accepted ONLY if it authenticates at
          # https://connect.squareupsandbox.com/v2/locations; the runner never
          # follows redirects or contacts Square production endpoints.
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: node scripts/certify-square-sandbox.mjs
      - name: Attach sandbox proof and blocker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: square-sandbox-proof-${{ github.run_id }}
          path: test-results/square-sandbox-certification.json
          if-no-files-found: error
          retention-days: 30
