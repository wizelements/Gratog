name: Real Square Sandbox Certification

on:
  push:
    branches:
      - fix/product-truth-and-square-sandbox-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  square-sandbox-transaction:
    name: Actual sandbox order, payment, declined card, replay and refund
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert and certify only Square Sandbox
        env:
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: node scripts/certify-square-sandbox.mjs
      - name: Attach immutable sandbox proof and blocker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-sandbox-proof-${{ github.run_id }}
          path: test-results/square-sandbox-certification.json
          if-no-files-found: error
          retention-days: 30
