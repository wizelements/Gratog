name: Real Square Sandbox Certification

on:
  push:
    branches:
      - fix/product-truth-and-square-sandbox-20261011
      - fix/blue-lotus-availability-square-catalog-20261011
      - fix/prepaid-commerce-safety-oct12
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  square-sandbox-transaction:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/prepaid-commerce-safety-oct12'
    name: Actual sandbox order, payment, declined card, replay and refund
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert and certify only Square Sandbox
        env:
          # Existing integration secret is accepted ONLY if it authenticates at
          # https://connect.squareupsandbox.com/v2/locations; the runner never
          # follows redirects or contacts Square production endpoints.
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN || secrets.SQUARE_ACCESS_TOKEN }}
        run: node scripts/certify-square-sandbox.mjs
      - name: Attach immutable sandbox proof and blocker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-sandbox-proof-${{ github.run_id }}
          path: test-results/square-sandbox-certification.json
          if-no-files-found: error
          retention-days: 30
