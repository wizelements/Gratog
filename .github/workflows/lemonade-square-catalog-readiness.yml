name: Lemonade Square Sandbox Catalog Readiness
on:
  push:
    branches: [feat/lemonade-packs-20261024]
    paths:
      - scripts/certify-square-sandbox-catalog-readiness.mjs
      - .github/workflows/lemonade-square-catalog-readiness.yml
      - tests/square-sandbox-readback.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-readback:
    name: Read-only approved lemonade Square Sandbox catalog and variations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: square-sandbox-certification
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify merchant and inventory guard regressions
        run: node --test tests/square-sandbox-readback.test.mjs
      - name: Read-only Square Sandbox catalog readback
        env:
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
          SQUARE_SANDBOX_MERCHANT_ID: ${{ vars.SQUARE_SANDBOX_MERCHANT_ID }}
          SQUARE_SANDBOX_LOCATION_ID: ${{ vars.SQUARE_SANDBOX_LOCATION_ID }}
        run: node scripts/certify-square-sandbox-catalog-readiness.mjs
      - name: Save provider readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lemonade-sandbox-catalog-proof-${{ github.run_id }}
          path: test-results/square-sandbox-catalog-readiness.json
          if-no-files-found: error
          retention-days: 30
