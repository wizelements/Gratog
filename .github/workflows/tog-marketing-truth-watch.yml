name: Taste of Gratitude Marketing Truth Watch

# GET-only evidence; never contacts customers, sends broadcasts, changes prices,
# updates live inventory, or authenticates to Square/Resend.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tog-marketing-live-readonly.mjs'
      - 'tests/release/tog-marketing-live-readonly.test.mjs'
      - '.github/workflows/tog-marketing-truth-watch.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tog-marketing-live-readonly.mjs'
      - 'tests/release/tog-marketing-live-readonly.test.mjs'
      - '.github/workflows/tog-marketing-truth-watch.yml'

permissions:
  contents: read

jobs:
  marketing-public-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify audit safety and negative controls
        run: node --test tests/release/tog-marketing-live-readonly.test.mjs
      - name: Verify live public pages (no credentials or writes)
        run: node scripts/tog-marketing-live-readonly.mjs
      - name: Publish audit truth without implying marketing certification
        if: always()
        run: |
          if test -f test-results/marketing-live-readonly.json; then
            node -e 'const r=require("./test-results/marketing-live-readonly.json"); console.log("RESULT="+r.result+" CHECKS="+r.passed+"/"+r.checked+" CERTIFIED="+r.certified);'
          fi
          echo 'This GET-only check does NOT certify Square payments, inventory, live email deliverability, subscriptions, Resend webhooks, or Grok Bot execution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save JSON evidence for Grokbot and OPEE
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tog-marketing-truth
          path: test-results/marketing-live-readonly.json
          retention-days: 30
          if-no-files-found: warn
