name: Production Closure Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-governance:
    name: Linux Node 22 Production Hardening Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      VERCEL_ENV: preview
      SQUARE_ENVIRONMENT: sandbox
      SQUARE_ACCESS_TOKEN: ci-square-token-placeholder
      SQUARE_APPLICATION_ID: ci-square-app-placeholder
      SQUARE_LOCATION_ID: ci-square-location-placeholder
      SQUARE_WEBHOOK_SIGNATURE_KEY: ci-square-webhook-placeholder
      RESEND_WEBHOOK_SECRET: ci-resend-webhook-placeholder
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      ADMIN_SETUP_SECRET: ci-admin-setup-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Static deploy guard
        run: scripts/gratog-deploy-guard.sh --target production --dry-run

      - name: Targeted lint for closure surfaces
        run: |
          ESLINT_USE_FLAT_CONFIG=false npx eslint \
            app/rewards/page.tsx \
            app/gratitude/rewards/page.jsx \
            app/reviews/page.jsx \
            'app/(site)/community/page.tsx' \
            app/subscriptions/page.js \
            app/robots.ts \
            app/sitemap.ts \
            lib/pwa.ts \
            tests/route-governance.test.ts \
            tests/pwa-cache-governance.test.ts

      - name: Route coverage
        run: npm run check:routes

      - name: Closure governance tests
        run: npm run check:route-governance

      - name: Georgia fulfillment and customer copy regression
        run: npx vitest run tests/georgia-only-orders.test.ts tests/regular-online-orders.test.ts tests/content-quality.test.ts tests/catalog-indexability.test.ts tests/inventory-preorder-boundaries.test.ts tests/cart-price-preview.test.ts tests/full-site-closure.test.ts tests/checkout-order-consistency.test.ts tests/checkout-single-order.test.ts tests/market-preorder-single-order.test.ts tests/preorder-line-integrity.test.ts tests/preorder-payment-confirmation-integrity.test.ts tests/preorder-privacy.test.ts tests/checkout-confirmation-integrity.test.ts tests/checkout-single-journey-consistency.test.ts tests/checkout-legacy-inventory-retirement.test.ts tests/checkout-refund-safety.test.ts tests/product-availability-consistency.test.ts tests/payment-retry-reconciliation.test.ts tests/product-owner-truth.test.ts tests/blue-lotus-availability-reconcile.test.ts tests/unit/cart-pricing.spec.ts --reporter=verbose

      - name: Square Sandbox payment contract regression (no credentials)
        run: node --test tests/square-sandbox-idempotency.test.mjs

      - name: Fresh Batch Square financial safety regression
        run: npx vitest run tests/fresh-batch/square-reservations.test.ts tests/fresh-batch/square-payment-reconciliation.test.ts tests/fresh-batch/square-webhook-auth.test.ts --reporter=verbose

      - name: Navigation coherence
        run: npx vitest run tests/navigation-coherence.test.ts --reporter=verbose

      - name: Typecheck
        run: npm run typecheck:ci

      - name: Production build on Linux
        run: npm run build

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production Closure Governance

          This workflow is the authoritative Linux/Node 22 gate for work that cannot be proven on the mobile Termux execution lane.

          Required gates:
          - deploy guard static governance
          - targeted lint for closure surfaces
          - route coverage
          - retired-route governance
          - PWA cache governance
          - navigation coherence
          - strict TypeScript check
          - production Next.js build

          Browser E2E and Lighthouse remain in their dedicated workflows because they are slower and require browser/system dependencies.
          EOF

  checkout-database-proof:
    name: Isolated Mongo Replica-set Checkout Race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only disposable CI data. Never access any live order or payment database.
      MONGODB_URI: mongodb://127.0.0.1:27017/tog_checkout_race_ci?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-checkout-only-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Start isolated Mongo replica set
        run: |
          docker run --detach --rm --name tog-checkout-mongo \
            -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec tog-checkout-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 2
          done
          docker exec tog-checkout-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec tog-checkout-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then break; fi
            sleep 2
          done
          docker exec tog-checkout-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)'
      - name: Prove real database concurrency and durable retry replay
        run: npx vitest run tests/integration/checkout-mongo-race.test.ts --reporter=verbose
      - name: Stop disposable database
        if: always()
        run: docker stop tog-checkout-mongo || true

  checkout-browser-proof:
    name: Headless Buyer Checkout Trust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      VERCEL_ENV: preview
      SQUARE_ENVIRONMENT: sandbox
      SQUARE_ACCESS_TOKEN: ci-placeholder-never-used-for-real-payment
      SQUARE_APPLICATION_ID: ci-placeholder
      SQUARE_LOCATION_ID: ci-placeholder
      SQUARE_WEBHOOK_SIGNATURE_KEY: ci-placeholder
      JWT_SECRET: ci-browser-test-only-secret-at-least-32-characters
      ADMIN_SETUP_SECRET: ci-browser-test-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Build isolated mock-payment browser app
        run: npm run build
      - name: Verify skeptical buyer journeys without real charges
        run: npx playwright test e2e/checkout-trust.spec.ts --project=chromium --retries=1
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-trust-browser-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
